<!doctype html>
<!--
  portal-admin.html — Administrator Portal
  ==========================================
  This portal is for the School Administrator role.

  Pages available in this portal:
    Overview          — Dashboard with school-wide stats and charts
    Students          — Full pupil register and admissions
    Teachers          — All teaching staff profiles
    Academics         — Subjects, classes, marks and report cards
    Attendance        — Daily pupil attendance register
    Finance           — School fees, payments and invoices
    Property & Transport — Books, buses and assets
    Boarding          — Dormitories and hostel assignments
    Timetables & Exams — Class and exam timetables
    Reports           — School performance reports and report cards
    Portal access     — Overview of all role portals (admin only)
    Custom fields     — Add extra inputs to any school form (admin only)

  The Administrator has FULL access to all sections and is the only
  role that can manage custom fields and view portal access.

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("admin") is called — it validates the session and
       confirms the signed-in role is "admin".
    3. If the session role does not match "admin", the user is
       redirected back to index.html (the login page).
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Administrator Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The shell() function builds the sidebar + topbar + content area.
    renderPage() fills the content area based on the active page variable.
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the Administrator portal.
     *
     * initPortal("admin") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "admin", redirects to index.html.
     *   3. Sets the global `role` variable to "admin".
     *   4. Loads the saved currentUser from sessionStorage.
     *   5. Calls render() which calls shell() then renderPage().
     *
     * The admin role has access to ALL pages including:
     *   - "Portal access"  — view and preview all role portals
     *   - "Custom fields"  — create / remove extra form inputs
     */
    initPortal("admin");
  </script>
</body>
</html>
