<!doctype html>
<!--
  portal-property.html — Property Department Portal
  ===================================================
  This portal is for the Property Department / Property Officer role.

  Pages available in this portal:
    Overview              — General school dashboard summary
    Property & Transport  — Full inventory management: books, school buses,
                            routes, drivers, assets and transport assignments

  The Property Officer manages all school assets including:
    - Library books and classroom textbooks (stock levels, locations)
    - School buses (routes, drivers, capacity, maintenance status)
    - Other physical assets (furniture, equipment, etc.)
    - Pupil transport assignments and transport fee tracking

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("property") validates the session role.
    3. If the session role is not "property", the user is redirected
       to index.html to sign in with the correct account.
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Property Department Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The sidebar will show only the 2 pages permitted for this role:
    Overview, Property & Transport.
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the Property Department portal.
     *
     * initPortal("property") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "property", redirects to index.html.
     *   3. Sets the global `role` variable to "property".
     *   4. Calls render() → shell() → renderPage().
     *
     * Accessible pages for this role:
     *   Overview | Property & Transport
     */
    initPortal("property");
  </script>
</body>
</html>
