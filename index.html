      return `${heading(module,description(module),action)}${module==="Payments"?`<div class="notice">Payment reminders can be prepared here. Sending SMS/WhatsApp requires connecting a trusted messaging provider.</div>`:""}
      <section class="panel table-panel"><div class="table-toolbar"><h2>${esc(module)} · ${rows.length} record(s)</h2><div class="filters"><input class="search" data-search placeholder="Search records…" value="${esc(query)}"></div></div>
      ${rows.length?`<div class="table-scroll"><table><thead><tr>${cols.map(([,label])=>`<th>${esc(label)}</th>`).join("")}${custom.map(field=>`<th>${esc(field.label)}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${rows.map(row=>`<tr>${cols.map(([key,label])=>`<td>${key==="name"||key==="title"?`<div class="person">${row.photo?`<span class="avatar"><img src="${esc(row.photo)}" alt=""></span>`:`<span class="avatar">${esc(initials(row[key]))}</span>`}<span><strong>${esc(row[key]||"—")}</strong><small>${esc(row.admission||row.staffId||row.code||"")}</small></span></div>`:key==="status"?badge(row[key]):esc(displayValue(row[key]))}</td>`).join("")}${custom.map(field=>`<td>${esc(row.customFields?.[field.id]||"—")}</td>`).join("")}<td><div class="actions"><button class="btn secondary small" data-edit="${esc(module)}" data-id="${esc(row._id)}">Edit</button><button class="btn danger small" data-delete="${esc(module)}" data-id="${esc(row._id)}">Delete</button>${module==="Payments"?`<button class="btn secondary small" data-receipt="${esc(row._id)}">Receipt</button>`:""}</div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><strong>No ${esc(module.toLowerCase())} records yet</strong>Use “${esc(def.add)}” to add the first record.</div>`}</section>`;
    }
    function description(module){return({Students:"Register pupils, assign class and stream, capture parent contacts, medical information and photos.",Teachers:"Register teachers, their subjects, assigned classes and profile photos.",Classes:"Create primary classes and streams and assign a class teacher.",Subjects:"Create subjects and assign teachers and classes.",Marks:"Enter assessments and calculate totals, averages, grades and positions.", "Student attendance":"Record daily pupil attendance as present, absent or late.","Teacher attendance":"Record staff attendance and check-in times.",Timetables:"Create class, teacher and subject timetables.",Examinations:"Schedule examinations by subject, class, date and venue.","Fees structure":"Set up tuition, boarding and transport fees by class and term.",Invoices:"Create pupil invoices and track due dates and payment status.",Payments:"Record payments and print receipts.",Scholarships:"Record discounts, scholarships and bursaries.","Financial reports":"Review invoices, receipts and balances.",Books:"Register books and track library inventory.","Book categories":"Create categories for the school book inventory.",Buses:"Register buses, capacity and vehicle status.",Drivers:"Register bus drivers, licences, contacts and photos.",Routes:"Create routes, assign drivers and buses and record pickup/drop-off points.","Transport assignments":"Assign pupils to routes and store pickup/drop-off details.",Dormitories:"Create dormitories, capacity and house staff.",Beds:"Register beds and track availability.", "Boarding assignments":"Assign pupils to dormitories and beds and record boarding fees.","House masters":"Register house masters and matrons with profile photos."})[module]||"Manage school records."}
    function displayValue(value){if(value===undefined||value===null||value==="")return "—";if(typeof value==="number")return value.toLocaleString("en-UG");return String(value)}
    function badge(value){const text=String(value||"—"),style=/absent|unpaid|inactive|maintenance|low stock|left/i.test(text)?"bad":/late|part|pending|leave|checked out/i.test(text)?"warn":"";return `<span class="badge ${style}">${esc(text)}</span>`}
    function reportCardsPage(){
      const students=db.students,marks=db.marks;
      return `${heading("Pupil report cards","Select a pupil to preview a printable report card with the school badge watermark and passport photo.",`<button class="btn secondary" data-action="print-report">Print current preview</button>`)}
      <div class="field no-print"><label for="reportStudent">Pupil</label><select id="reportStudent"><option value="">Choose pupil…</option>${students.map((student,index)=>`<option value="${index}">${esc(student.name)} · ${esc(student.admission)}</option>`).join("")}</select></div><div id="reportPreview">${reportMarkup(students[0]||null,marks.filter(mark=>!students[0]||mark.admission===students[0].admission))}</div>`;
    }
    // Build a printable report card; totals and grades are calculated from
    // the pupil's assessment records and the badge is used as a watermark.
    function reportMarkup(student,marks){
      if(!student)return `<div class="panel empty">Register a pupil before creating a report card.</div>`;
      const bySubject={};marks.forEach(mark=>{const key=mark.subject||"Subject";(bySubject[key]||(bySubject[key]=[])).push(mark)});
      const rows=Object.entries(bySubject).map(([subject,list])=>{const score=list.reduce((sum,item)=>sum+(Number(item.score)||0),0),out=list.reduce((sum,item)=>sum+(Number(item.outOf)||0),0),percent=out?score/out*100:0;return{subject,total:score,out,percent,grade:grade(percent)}})
        .sort((a,b)=>b.percent-a.percent);
      const total=rows.reduce((sum,row)=>sum+row.total,0),out=rows.reduce((sum,row)=>sum+row.out,0),average=rows.length?rows.reduce((sum,row)=>sum+row.percent,0)/rows.length:0;
      const rank=studentsRank(student);
      return `<article class="watermark-preview"><svg class="report-watermark" viewBox="0 0 160 190" aria-hidden="true"><path d="M80 8 145 32v56c0 42-26 74-65 94C41 162 15 130 15 88V32L80 8Z" fill="#d9ad4a" stroke="#203858" stroke-width="6"/><path d="M31 47 80 29l49 18v40c0 30-17 54-49 72-32-18-49-42-49-72V47Z" fill="none" stroke="#203858" stroke-width="3"/><text x="80" y="84" text-anchor="middle" font-size="30" fill="#203858">✦</text><text x="80" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#203858">KHA</text><text x="80" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="2" fill="#203858">KASESE</text></svg><header class="report-header"><div style="font-size:26px">✦</div><strong>KASESE HILLS ACADEMY</strong><h2>PUPIL PROGRESS REPORT</h2><span>Kasese · Uganda · ${esc(new Date().getFullYear())}</span></header><div class="report-body"><div class="passport">${student.photo?`<img src="${esc(student.photo)}" alt="Pupil passport photo" style="width:100%;height:100%;object-fit:cover">`:"PASSPORT PHOTO"}</div><div><p><strong>Name:</strong> ${esc(student.name)}<br><strong>Admission no:</strong> ${esc(student.admission)}<br><strong>Class:</strong> ${esc(student.class)} · Stream ${esc(student.stream)}<br><strong>Term:</strong> ${esc(rows[0]?.term||"School term")}<br><strong>Class position:</strong> ${rank||"—"}</p></div></div><table class="report-table"><thead><tr><th>Subject</th><th>Total</th><th>Out of</th><th>Average</th><th>Grade</th></tr></thead><tbody>${rows.length?rows.map(row=>`<tr><td>${esc(row.subject)}</td><td>${row.total}</td><td>${row.out}</td><td>${row.percent.toFixed(1)}%</td><td>${row.grade}</td></tr>`).join(""):`<tr><td colspan="5">No assessment marks have been entered for this pupil.</td></tr>`}</tbody><tfoot><tr><th>Total / average</th><th>${total}</th><th>${out}</th><th>${average.toFixed(1)}%</th><th>${grade(average)}</th></tr></tfoot></table><div class="report-signatures" style="display:flex;justify-content:space-between;margin-top:34px;font-size:10px"><span>Class teacher: ____________________</span><span>Head teacher: ____________________</span></div></article>`;
    }
    function grade(percent){return percent>=80?"D1":percent>=75?"D2":percent>=70?"C3":percent>=65?"C4":percent>=60?"C5":percent>=55?"C6":percent>=50?"P7":percent>=45?"P8":"F9"}
    function studentsRank(student){const all=db.students.map(item=>{const rows=db.marks.filter(mark=>mark.admission===item.admission),total=rows.reduce((sum,row)=>sum+(Number(row.score)||0),0),out=rows.reduce((sum,row)=>sum+(Number(row.outOf)||0),0);return{admission:item.admission,average:out?total/out*100:0}}).sort((a,b)=>b.average-a.average);const index=all.findIndex(row=>row.admission===student.admission);return index>=0&&all[index].average?index+1:null}
    function financialReportsPage(){
      const invoices=db.invoices,payments=db.payments,totalInvoiced=invoices.reduce((sum,row)=>sum+amountNumber(row.amount),0),collected=payments.reduce((sum,row)=>sum+amountNumber(row.amount),0);
      return `${heading("Financial reports","Review fees billed, money received and outstanding balances.",`<button class="btn secondary" data-action="print-list">Print report</button>`)}<div class="stats">${metric("Invoices",invoices.length,"Created invoices")}${metric("Invoiced",`UGX ${totalInvoiced.toLocaleString("en-UG")}`,"Total invoice amounts")}${metric("Collected",`UGX ${collected.toLocaleString("en-UG")}`,"Payment receipts")}${metric("Balance",`UGX ${Math.max(0,totalInvoiced-collected).toLocaleString("en-UG")}`,"Invoiced less paid")}</div><section class="panel"><div class="panel-head"><h2>Recent payments</h2><button class="btn secondary small" data-page="Payments">View payments</button></div><p class="hint">SMS and WhatsApp reminders require a messaging service. This prototype does not send messages or collect real payments.</p></section>`;
    }
    function renderPage(){
      const content=root.querySelector("#content");if(!content)return;
      if(page==="Overview"){content.innerHTML=dashboard();return}
      if(page==="Portal access"&&role==="admin"){content.innerHTML=portalAccess();return}
      if(page==="Report cards"){content.innerHTML=reportCardsPage();return}
      if(page==="Financial reports"){content.innerHTML=financialReportsPage();return}
      if(!permittedPages().includes(page)){content.innerHTML=`<section class="panel empty"><strong>Page not available</strong>This page is not part of your portal.</section>`;return}
      content.innerHTML=recordsPage(page);
    }
    function customFor(module){return customFields.filter(field=>field.module===module)}
    function fieldMarkup(field,value=""){
      const [key,label,type,required,options]=field;const req=required?"required":"",val=esc(value);
      if(type==="photo")return `<div class="field"><label for="f-${key}">${esc(label)}</label><div class="photo-upload"><img class="photo-preview" src="${val||""}" alt="" ${value?"":"hidden"}><input id="f-${key}" name="${key}" type="file" accept="image/*"></div></div>`;
      if(type==="select")return `<div class="field"><label for="f-${key}">${esc(label)}${required?" *":""}</label><select id="f-${key}" name="${key}" ${req}><option value="">Choose…</option>${(options||[]).map(option=>`<option ${value===option?"selected":""}>${esc(option)}</option>`).join("")}</select></div>`;
      if(type==="textarea")return `<div class="field full"><label for="f-${key}">${esc(label)}${required?" *":""}</label><textarea id="f-${key}" name="${key}" ${req}>${val}</textarea></div>`;
      return `<div class="field"><label for="f-${key}">${esc(label)}${required?" *":""}</label><input id="f-${key}" name="${key}" type="${esc(type)}" value="${type==="date"?val:val}" ${req} ${type==="number"?'min="0"':''}></div>`;
    }
    // Reuse the module schema for creating and editing records, including
    // optional profile photos and custom inputs.
    function openRecordForm(module,id=null){
      const def=DEFINITIONS[module],existing=id?(db[def.key]||[]).find(row=>row._id===id):null;if(!def)return;
      const custom=customFor(module),fields=def.fields.map(field=>fieldMarkup(field,existing?.[field[0]])).join("")+
        custom.map(field=>fieldMarkup([`custom_${field.id}`,field.label,field.type,field.required,field.options],existing?.customFields?.[field.id])).join("");
      const wrap=document.createElement("div");wrap.className="modal-backdrop";wrap.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${existing?"Edit":"Add"} ${esc(def.noun)}</h2><button class="icon-btn" data-close aria-label="Close">×</button></div><form id="recordForm"><div class="modal-body"><div class="form-grid">${fields}</div><div class="modal-actions"><button class="btn secondary" type="button" data-close>Cancel</button><button class="btn" type="submit">${existing?"Save changes":"Save record"}</button></div></div></form></div>`;
      document.body.appendChild(wrap);wrap.querySelectorAll("[data-close]").forEach(btn=>btn.addEventListener("click",()=>wrap.remove()));wrap.addEventListener("click",event=>{if(event.target===wrap)wrap.remove()});
      wrap.querySelectorAll('input[type="file"]').forEach(input=>input.addEventListener("change",()=>{const file=input.files?.[0];if(!file)return;if(file.size>8*1024*1024){toast("Choose an image smaller than 8 MB.");input.value="";return}const image=new Image();image.onload=()=>{const canvas=document.createElement("canvas"),scale=Math.min(1,240/Math.max(image.width,image.height));canvas.width=Math.max(1,image.width*scale);canvas.height=Math.max(1,image.height*scale);canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);input.dataset.image=canvas.toDataURL("image/jpeg",.76);const preview=input.parentElement.querySelector("img");preview.src=input.dataset.image;preview.hidden=false};image.onerror=()=>toast("Could not open the selected photo.");image.src=URL.createObjectURL(file)}));
      wrap.querySelector("#recordForm").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget,fd=new FormData(form),record={...(existing||{}),_id:existing?existing._id:crypto.randomUUID(),createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),customFields:{...(existing?.customFields||{})}};
        for(const field of def.fields){const [key,label,type]=field;if(type==="photo"){const input=form.elements[key];if(input?.dataset.image)record[key]=input.dataset.image;continue}record[key]=fd.get(key)||"";if(type==="number"&&record[key]!=="")record[key]=Number(record[key])}
        custom.forEach(field=>{const key=`custom_${field.id}`;record.customFields[field.id]=fd.get(key)||""});
        if(def.key==="marks"){const maximum=Number(record.outOf);if(!maximum||Number(record.score)>maximum){toast("Score must not exceed a positive maximum mark.");return}record.grade=grade(Number(record.score)/maximum*100)}
        let target=(db[def.key]||[]);if(existing){const index=target.findIndex(row=>row._id===id);if(index<0)return;target[index]=record}else target.unshift(record);
        if(!saveDB())return;wrap.remove();renderPage();toast(existing?"Record updated.":"Record added.");
      });
      wrap.querySelector('input:not([type=file]),select,textarea')?.focus();
    }
    function onContentClick(event){
      const pageBtn=event.target.closest("[data-page]");if(pageBtn){navigate(pageBtn.dataset.page);return}
      const roleBtn=event.target.closest("[data-open-role]");if(roleBtn){if(role!=="admin")return;portalPreview=roleBtn.dataset.openRole;page="Overview";history=[];render();return}
      const create=event.target.closest("[data-create]");if(create){openRecordForm(create.dataset.create);return}
      const edit=event.target.closest("[data-edit]");if(edit){openRecordForm(edit.dataset.edit,edit.dataset.id);return}
      const remove=event.target.closest("[data-delete]");if(remove){const def=DEFINITIONS[remove.dataset.delete],records=db[def.key],index=records.findIndex(row=>row._id===remove.dataset.id);if(index<0)return;if(!confirm(`Delete this ${def.noun}? This cannot be undone.`))return;records.splice(index,1);if(saveDB()){renderPage();toast("Record deleted.")}return}
      const receipt=event.target.closest("[data-receipt]");if(receipt){const row=db.payments.find(item=>item._id===receipt.dataset.receipt);if(row)printReceipt(row);return}
      const action=event.target.closest("[data-action]")?.dataset.action;if(action==="print-list")window.print();if(action==="print-report")window.print();
    }
    function onContentInput(event){
      if(event.target.matches("[data-search]")){query=event.target.value;const pos=event.target.selectionStart;renderPage();const input=root.querySelector("[data-search]");input?.focus();input?.setSelectionRange(pos,pos)}
      if(event.target.id==="reportStudent"){const student=db.students[Number(event.target.value)]||null;const marks=db.marks.filter(mark=>!student||mark.admission===student.admission);root.querySelector("#reportPreview").innerHTML=reportMarkup(student,marks)}
    }
    function onContentSubmit(){}
    function printReceipt(row){
      const win=window.open("","_blank","width=720,height=760");if(!win){toast("Allow pop-ups to preview the receipt.");return}
      win.document.write(`<!doctype html><html><head><title>School fee receipt</title><style>body{font:14px Arial;padding:35px;color:#17243a}.receipt{max-width:620px;margin:auto;border:1px solid #ccd3df;padding:30px}.center{text-align:center}table{width:100%;margin-top:24px;border-collapse:collapse}td{padding:12px;border:1px solid #ddd}.muted{color:#68758a}</style></head><body><article class="receipt"><header class="center"><h1>KASESE HILLS ACADEMY</h1><p>Kasese · Uganda</p><h2>OFFICIAL FEE RECEIPT</h2></header><table><tr><td>Receipt number</td><td>${esc(row.reference)}</td></tr><tr><td>Date</td><td>${esc(row.date)}</td></tr><tr><td>Pupil</td><td>${esc(row.name)}</td></tr><tr><td>Admission number</td><td>${esc(row.admission)}</td></tr><tr><td>Amount received</td><td>UGX ${esc(Number(row.amount||0).toLocaleString("en-UG"))}</td></tr><tr><td>Method</td><td>${esc(row.method)}</td></tr></table><p style="margin-top:35px">Cashier: ____________________ <span style="float:right">Parent: ____________________</span></p><p class="center muted">Thank you. Please keep this receipt.</p></article><script>window.onload=()=>window.print()<\/script></body></html>`);win.document.close()
    }
    const savedRole=sessionStorage.getItem("kha-role");
    if(savedRole&&ROLES[savedRole]){role=savedRole;user=loadJSON("kha-user",{});render()}else loginScreen();
  })();
  </script>
</body>
