<!doctype html>
<!--
  portal-accountant.html — School Accountant Portal
  ===================================================
  This portal is for the School Accountant role.

  Pages available in this portal:
    Overview  — Finance-focused dashboard (fees collected, outstanding,
                payments today, scholarships — instead of the general stats)
    Finance   — Full fees and payments management: invoices, receipts,
                outstanding balances and payment status
    Students  — Read-only access to the pupil register to look up
                pupil details when recording payments

  The Accountant manages all financial records for the school.
  They record fee payments, issue receipts, track outstanding balances,
  and monitor scholarships and bursaries.

  Note: The Overview page automatically detects the "accountant" role
  and displays finance-specific stat cards (defined in overviewPage()
  inside shared.js).

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("accountant") validates the session role.
    3. If the session role is not "accountant", the user is redirected
       to index.html to sign in with the correct account.
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Accountant Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The sidebar will show only the 3 pages permitted for this role:
    Overview, Finance, Students.

    The Overview page shows finance-specific stat cards for this role
    (fees collected, outstanding fees, today's payments, scholarships).
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the School Accountant portal.
     *
     * initPortal("accountant") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "accountant", redirects to index.html.
     *   3. Sets the global `role` variable to "accountant".
     *   4. Calls render() → shell() → renderPage().
     *
     * Accessible pages for this role:
     *   Overview | Finance | Students
     *
     * The Overview page detects role === "accountant" and switches to
     * finance-focused stat cards automatically (see overviewPage() in shared.js).
     */
    initPortal("accountant");
  </script>
</body>
</html>
