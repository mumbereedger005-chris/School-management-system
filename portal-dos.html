<!doctype html>
<!--
  portal-dos.html — Director of Studies Portal
  =============================================
  The DOS manages the complete academic programme of Five Star Model School.
  Responsibilities covered in this portal:
    • Teacher registration with profile photos
    • Class and stream creation
    • Subject management and teacher assignments
    • Class and examination timetable builder
    • Marks entry with auto-calculated grades (D1–F9 Uganda scale)
    • Report card generation with pupil passport photo
    • Daily pupil attendance (Present / Absent / Late / Excused)
    • Teacher attendance register
    • Examination scheduling
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Director of Studies — Five Star Model School</title>
  <script src="shared.js"></script>
  <script src="staff-team.js"></script>
  <style>
    #dos-print-area { display: none; }
    @media print {
      body.dos-all-printing #root { display: none !important; }
      body.dos-all-printing #dos-print-area {
        display: block !important;
        position: static !important;
        color: #111;
        background: #fff;
        font: 10px Arial, sans-serif;
      }
      #dos-print-area h1 { text-align: center; margin-bottom: 4px; }
      #dos-print-area h2 { margin: 18px 0 6px; page-break-after: avoid; }
      #dos-print-area table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
      #dos-print-area th, #dos-print-area td { border: 1px solid #aaa; padding: 4px; text-align: left; }
      #dos-print-area th { background: #eee !important; }
      #rcOutput .report-card + .report-card { page-break-before: always; break-before: page; }
      #kha-content .cards { grid-template-columns: repeat(2,minmax(0,1fr)); }
      #kha-content .module-card { break-inside: avoid; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

KHA.init("dos", function(session) {

  /* ── state ── */
  var page    = "Dashboard";
  var hist    = [];
  var searchQ = "";
  var timetableSchedule = "Weekly";
  var timetableExamType = "Mid-term";
  var timetableClass = "";
  var timetableYear = KHA.CURRENT_YEAR;
  var reportClass = "";

  /* ── navigation ── */
  function navigate(p) {
    if (p === page) return;
    hist.push(page); page = p; searchQ = "";
    renderPage();
  }
  function goBack() {
    if (!hist.length) return;
    page = hist.pop(); renderPage();
  }

  /* ── boot ── */
  function boot() {
    KHA.buildShell({
      roleKey: "dos", navGroups: KHA.ROLES.dos.groups,
      activePage: page, onNav: navigate, session: session,
      extraRight: '<a href="index.html" class="btn secondary small no-print">All portals</a>'
    });
    document.getElementById("kha-back").addEventListener("click", goBack);
    window.addEventListener("afterprint", function(){
      document.body.classList.remove("dos-all-printing");
      var printArea = document.getElementById("dos-print-area");
      if (printArea) printArea.remove();
    });
    renderPage();
  }

  /* ══════════════════════════════════════════════════════
     DISPATCHER
  ══════════════════════════════════════════════════════ */
  function renderPage() {
    KHA.setCrumb(page);
    document.getElementById("kha-back").disabled = !hist.length;
    var h = "";
    switch(page) {
      case "Dashboard":            h = pgDashboard();    break;
      case "Teachers":             h = pgTeachers();     break;
      case "Staff profiles":       h = pgStaffProfiles(); break;
      case "Classes":              h = pgClasses();      break;
      case "Streams":              h = pgClasses();      break;  // Same UI, just navigated differently
      case "Subjects":             h = pgSubjects();     break;
      case "Class timetable":      h = pgTimetable("Class");   break;
      case "Examination timetable":h = pgTimetable("Exam");    break;
      case "Marks":                h = pgMarks();        break;
      case "Report cards":         h = pgReportCards();  break;
      case "Examinations":         h = pgExaminations(); break;
      case "Pupil attendance":   h = pgStudentAtt();   break;
      case "Daily enrollment":    h = pgDailyEnrollment(); break;
      case "Teacher attendance":   h = pgTeacherAtt();   break;
      case "Parent updates":       h = KHA.renderParentUpdates("dos", session); break;
      case "School team":          h = window.renderSchoolTeam(); break;
      case "Messages":             h = KHA.renderMessages("dos", session); break;
      default: h = pgDashboard();
    }
    KHA.setContent(h);
    wireEvents();
  }

  /* ══════════════════════════════════════════════════════
     DASHBOARD
  ══════════════════════════════════════════════════════ */
  function pgDashboard() {
    var teachers  = KHA.load(KHA.STORE.teachers, []);
    var classes   = KHA.load(KHA.STORE.classes, []);
    var subjects  = KHA.load(KHA.STORE.subjects, []);
    var marks     = KHA.load(KHA.STORE.marks, []);
    var students  = KHA.load(KHA.STORE.students, []);
    var att       = KHA.load(KHA.STORE.attendance, []);
    var todayAtt  = att.filter(function(a){ return a.date === KHA.today(); });
    var studentPresent = todayAtt.filter(function(a){ return a.status === "Present"; }).length;
    var studentAbsent  = todayAtt.filter(function(a){ return a.status === "Absent"; }).length;
    var teacherAtt = KHA.load(KHA.STORE.teacherAtt, []).filter(function(a){ return a.date === KHA.today(); });
    var teacherPresent = teacherAtt.filter(function(a){ return a.status === "Present"; }).length;
    var teacherAbsent = teacherAtt.filter(function(a){ return a.status === "Absent"; }).length;
    var active    = students.filter(function(s){ return s.status === "Active"; }).length;
    var hour      = new Date().getHours();
    var greet     = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";

    /* Recent marks feed */
    var recentMarks = marks.slice().sort(function(a,b){
      return (b.createdAt||"").localeCompare(a.createdAt||"");
    }).slice(0, 6);

    return KHA.pageHead(greet + ", " + KHA.esc(session.name.split(" ")[0]),
      "Academic management — " + KHA.CURRENT_YEAR,
      '<button class="btn secondary small no-print" data-action="printAllRecords">Print all records</button>'
      +'<button class="btn small no-print" data-action="addTeacher">+ Add teacher</button>')

    + '<div class="stats">'
    + KHA.statCard("","Teaching staff", teachers.length, "Registered teachers", true)
    + KHA.statCard("","Classes",         classes.length,  "Class groups")
    + KHA.statCard("","Subjects",        subjects.length, "Curriculum subjects")
    + KHA.statCard("","Marks entered",   marks.length,    "Assessment records")
    + KHA.statCard("","Active pupils",   active,          "Currently enrolled")
    + KHA.statCard("","Teachers present",teacherPresent,teacherAbsent+" absent today")
    + KHA.statCard("","Pupils present",  studentPresent,  studentAbsent+" absent today")
    + '</div>'

    + '<div class="grid2">'
    /* Subject coverage bars */
    + '<section class="panel"><div class="panel-head"><h2>Subjects by class</h2>'
    + '<small>Subjects assigned per class</small></div><div class="bars">'
    + KHA.CLASS_LIST.map(function(c){
        var n = subjects.filter(function(s){ return (s.classes||"").includes(c); }).length;
        var max = Math.max.apply(null, KHA.CLASS_LIST.map(function(x){
          return subjects.filter(function(s){ return (s.classes||"").includes(x); }).length;
        }).concat([1]));
        return '<div class="barline"><span title="'+c+'">'+c+'</span>'
          +'<div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,Math.round((n/max)*100))+'%"></div></div>'
          +'<strong>'+n+'</strong></div>';
      }).join("")
    + '</div></section>'

    /* Recent marks */
    + '<section class="panel"><div class="panel-head"><h2>Recent assessments</h2></div>'
    + '<div class="activities">'
    + (recentMarks.length ? recentMarks.map(function(m){
        return '<div class="activity">'
          +'<div><p><strong>'+KHA.esc(m.pupilName||m.name||(m.admission?"Pupil number: "+m.admission:"—"))+'</strong> · '
          +KHA.esc(m.subject)+' · <span style="font-weight:700">'
          +(m.grade||KHA.gradeFromScore(m.score,m.outOf))+'</span></p>'
          +'<time>'+KHA.esc(m.term)+ ' · ' +KHA.fmtRelativeDate(m.createdAt)+'</time></div></div>';
      }).join("")
      : '<div class="empty"><strong>No marks yet</strong>Enter marks to see them here.</div>')
    + '</div></section>'
    + '</div>'

    /* Quick action tiles */
    + '<div class="cards">'
    + qCard("Teachers",         "Manage teaching staff records",    "Teachers")
    + qCard("Classes & streams", "Create and manage class groups",    "Classes")
    + qCard("Subjects",          "Assign subjects to classes",        "Subjects")
    + qCard("Class timetable",   "Build weekly, weekend and remedial schedules", "Class timetable")
    + qCard("Enter marks",       "Record assessment marks",           "Marks")
    + qCard("Report cards",      "Generate pupil report cards",       "Report cards")
    + qCard("Pupil attendance","Mark daily attendance",             "Pupil attendance")
    + qCard("Daily enrollment","Record daily pupil enrollment totals","Daily enrollment")
    + qCard("Examinations",      "Schedule examination dates",        "Examinations")
    + '</div>';
  }

  function qCard(title, desc, navPage) {
    return '<div class="module-card">'
      +'<h3>'+KHA.esc(title)+'</h3><p>'+KHA.esc(desc)+'</p>'
      +'<button class="btn small" data-nav-to="'+KHA.esc(navPage)+'">Open →</button>'
      +'</div>';
  }

  /* ══════════════════════════════════════════════════════
     TEACHERS
  ══════════════════════════════════════════════════════ */
  function pgTeachers() {
    var rows = KHA.load(KHA.STORE.teachers, []).filter(function(t){
      if (!searchQ) return true;
      var q = searchQ.toLowerCase();
      return (t.name||"").toLowerCase().includes(q)||(t.staffId||"").toLowerCase().includes(q);
    });
    return KHA.pageHead("Teachers", rows.length+" teacher(s)",
      '<input class="search" id="tSearch" placeholder="Search…" value="'+KHA.esc(searchQ)+'">'
      +'<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print teaching staff</button>'
      +'<button class="btn small" data-action="addTeacher">+ Add teacher</button>')
    + '<div class="table-wrap">'
    + KHA.buildTable([
        {key:"photo",label:"",render:function(r){
          return '<span class="avatar sm">'+(r.photo?'<img src="'+KHA.esc(r.photo)+'" alt="">':KHA.esc(KHA.initials(r.name)))+'</span>';
        }},
        {key:"name",label:"Teacher",render:function(r){
          return '<div><strong>'+KHA.esc(r.name)+'</strong><br><small>'+KHA.esc(r.staffId||"—")+'</small></div>';
        }},
        {key:"subjects",label:"Subjects"},
        {key:"classes",label:"Classes"},
        {key:"qualification",label:"Qualification"},
        {key:"phone",label:"Phone"},
        {key:"status",label:"Status",render:sBadge}
      ], rows, function(r){
        return '<button class="btn icon" data-view-teacher="'+KHA.esc(r.id)+'" title="View">👁</button>'
          +'<button class="btn icon" data-edit-teacher="'+KHA.esc(r.id)+'" title="Edit">✏️</button>'
          +'<button class="btn icon danger" data-del-teacher="'+KHA.esc(r.id)+'" title="Delete">🗑️</button>';
      })
    + '</div>';
  }

  /* ── Staff profile photo grid ── */
  function pgStaffProfiles() {
    var teachers = KHA.load(KHA.STORE.teachers, []);
    var html = KHA.pageHead("Staff profiles", "Photo directory of all teaching staff",
      '<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print all profiles</button>'
      +'<button class="btn small" data-action="addTeacher">+ Add teacher</button>');
    if (!teachers.length) return html + '<div class="notice info">No teachers registered yet.</div>';
    html += '<div class="cards">';
    teachers.forEach(function(t){
      html += '<div class="module-card" style="text-align:center">'
        +'<div style="display:flex;justify-content:center;margin-bottom:10px">'
        +(t.photo
          ?'<img src="'+KHA.esc(t.photo)+'" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--line)">'
          :'<span class="avatar lg">'+KHA.esc(KHA.initials(t.name))+'</span>')
        +'</div>'
        +'<strong>'+KHA.esc(t.name)+'</strong><br>'
        +'<small style="color:var(--muted)">'+KHA.esc(t.staffId||"")+'</small><br>'
        +'<small style="color:var(--muted)">Staff ID: '+KHA.esc(t.staffId||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Subjects: '+KHA.esc(t.subjects||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Classes: '+KHA.esc(t.classes||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Phone: '+KHA.esc(t.phone||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Email: '+KHA.esc(t.email||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Qualification: '+KHA.esc(t.qualification||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Experience: '+KHA.esc(t.experience||"0")+' year(s)</small><br>'
        +'<small style="color:var(--muted)">Employed: '+KHA.esc(t.employmentDate||"—")+'</small><br>'
        +'<small style="color:var(--muted)">Address: '+KHA.esc(t.address||"—")+'</small><br>'
        +'<small>Status: '+KHA.esc(t.status||"—")+'</small><br>'
        +sBadge(t)
        +'<div style="display:flex;gap:6px;justify-content:center;margin-top:10px">'
        +'<button class="btn secondary small no-print" data-view-teacher="'+KHA.esc(t.id)+'">View</button>'
        +'<button class="btn small no-print" data-edit-teacher="'+KHA.esc(t.id)+'">Edit</button>'
        +'</div></div>';
    });
    return html + '</div>';
  }

  /* ══════════════════════════════════════════════════════
     CLASSES & STREAMS
  ══════════════════════════════════════════════════════ */
  function pgClasses() {
    var rows = KHA.load(KHA.STORE.classes, []).filter(function(c){
      if (!searchQ) return true;
      return (c.className||"").toLowerCase().includes(searchQ.toLowerCase())
        || (c.stream||"").toLowerCase().includes(searchQ.toLowerCase());
    });
    return KHA.pageHead("Classes & streams", rows.length+" class group(s)",
      '<input class="search" id="tSearch" placeholder="Search…" value="'+KHA.esc(searchQ)+'">'
      +'<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print classes & streams</button>'
      +'<button class="btn small" data-action="addRecord" data-store="classes">+ Create class</button>')
    + '<div class="table-wrap">'
    + KHA.buildTable([
        {key:"className",label:"Class"},
        {key:"stream",label:"Stream"},
        {key:"teacher",label:"Class teacher"},
        {key:"room",label:"Room"},
        {key:"capacity",label:"Capacity"},
        {key:"subjects",label:"Subjects"}
      ], rows, function(r){
        return '<button class="btn icon" data-edit-record="'+KHA.esc(r.id)+'" data-store="classes" title="Edit">✏️</button>'
          +'<button class="btn icon danger" data-del-record="'+KHA.esc(r.id)+'" data-store="classes" title="Delete">🗑️</button>';
      })
    + '</div>';
  }

  /* ══════════════════════════════════════════════════════
     SUBJECTS
  ══════════════════════════════════════════════════════ */
  function pgSubjects() {
    var rows = KHA.load(KHA.STORE.subjects, []).filter(function(s){
      if (!searchQ) return true;
      return (s.name||"").toLowerCase().includes(searchQ.toLowerCase());
    });
    return KHA.pageHead("Subjects", rows.length+" subject(s)",
      '<input class="search" id="tSearch" placeholder="Search…" value="'+KHA.esc(searchQ)+'">'
      +'<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print subjects & class assignments</button>'
      +'<button class="btn small" data-action="addRecord" data-store="subjects">+ Add subject</button>')
    + '<div class="table-wrap">'
    + KHA.buildTable([
        {key:"name",label:"Subject"},
        {key:"code",label:"Code"},
        {key:"teacher",label:"Teacher"},
        {key:"classes",label:"Classes"},
        {key:"periodsPerWeek",label:"Periods/wk"},
        {key:"passMark",label:"Pass mark"}
      ], rows, function(r){
        return '<button class="btn icon" data-edit-record="'+KHA.esc(r.id)+'" data-store="subjects" title="Edit">✏️</button>'
          +'<button class="btn icon danger" data-del-record="'+KHA.esc(r.id)+'" data-store="subjects" title="Delete">🗑️</button>';
      })
    + '</div>';
  }

  /* ══════════════════════════════════════════════════════
     CLASS AND EXAM TIMETABLES
  ══════════════════════════════════════════════════════ */
  function pgTimetable(type) {
    var all   = KHA.load(KHA.STORE.timetable, []);
    var rows  = all.filter(function(r){ return r.ttType === type && (r.year||KHA.CURRENT_YEAR)===timetableYear; });
    var scheduleTypes = ["Weekly","Weekend","Remedial"];
    var classOptions = timetableClassOptions();
    if (!timetableClass || classOptions.indexOf(timetableClass)===-1) timetableClass=classOptions[0]||"";
    rows = rows.filter(function(r){
      if (type==="Class") {
        return (r.scheduleType||"Weekly")===timetableSchedule && r.class===timetableClass;
      }
      return r.examType===timetableExamType;
    });
    var days = type==="Exam"
      ? ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
      : timetableSchedule==="Weekly" ? ["Monday","Tuesday","Wednesday","Thursday","Friday"]
        : timetableSchedule==="Weekend" ? ["Saturday","Sunday"]
          : ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var periods = Array.from(new Set(rows.map(timetablePeriodLabel))).sort(function(a,b){
      return timetablePeriodMinutes(a)-timetablePeriodMinutes(b);
    });

    var selector = type==="Class"
      ? '<select class="search no-print" id="ttScheduleType">'+scheduleTypes.map(function(schedule){
          return '<option'+(schedule===timetableSchedule?" selected":"")+'>'+schedule+'</option>';
        }).join("")+'</select>'
        +'<select class="search no-print" id="ttClass">'+classOptions.map(function(className){
          return '<option value="'+KHA.esc(className)+'"'+(className===timetableClass?" selected":"")+'>'+KHA.esc(className)+'</option>';
        }).join("")+'</select>'
      : '<select class="search no-print" id="ttExamType">'
        +["Mid-term","End-of-term"].map(function(examType){
          return '<option'+(examType===timetableExamType?" selected":"")+'>'+examType+'</option>';
        }).join("")+'</select>';
    selector += '<select class="search no-print" id="ttYear">'
      +KHA.ACADEMIC_YEARS.map(function(year){
        return '<option'+(year===timetableYear?" selected":"")+'>'+KHA.esc(year)+'</option>';
      }).join("")+'</select>';
    var html = KHA.pageHead(type==="Class"?"Class timetable":"Exam timetable",
      (type==="Class"?timetableSchedule+" schedule for "+timetableClass:"Schedule for "+timetableExamType+" examinations")
        +" — "+timetableYear,
      selector
      +'<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print timetable</button>'
      +'<button class="btn small no-print" data-action="addTT" data-tt-type="'+KHA.esc(type)+'"'
        +' data-schedule-type="'+KHA.esc(type==="Class"?timetableSchedule:timetableExamType)+'">+ Add lesson slot</button>'
      );

    /* Build the grid table */
    html += '<div style="overflow-x:auto"><table class="timetable-grid">'
      +'<thead><tr><th style="min-width:80px">Period</th>'
      +days.map(function(d){ return '<th>'+d+'</th>'; }).join("")
      +'</tr></thead><tbody>';

    periods.forEach(function(p){
      html += '<tr><td class="time-col">'+p+'</td>';
      days.forEach(function(d){
        var slot = rows.find(function(r){ return r.day === d && timetablePeriodLabel(r) === p; });
        if (slot) {
          html += '<td><div class="tt-cell">'
            +'<div class="subject">'+KHA.esc(slot.subject||slot.name||"")+'</div>'
            +'<div class="teacher">'+KHA.esc(slot.teacher||slot.class||"")+'</div>'
            +(slot.room?'<div style="font-size:8px;color:#aaa">'+KHA.esc(slot.room)+'</div>':"")
            +'<button class="btn ghost" style="font-size:8px;padding:0" data-del-tt="'+KHA.esc(slot.id)+'">✕</button>'
            +'</div></td>';
        } else {
          html += '<td><span class="tt-empty">—</span></td>';
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    if (!rows.length) html += '<div class="notice info">No '+KHA.esc(type==="Class"?timetableSchedule.toLowerCase():timetableExamType.toLowerCase())
      +' timetable slots yet. Use “+ Add lesson slot” to create the first entry.</div>';
    return html;
  }

  function timetablePeriodLabel(slot) {
    return slot.startTime&&slot.endTime
      ? slot.startTime+"–"+slot.endTime
      : slot.period||"Time not set";
  }

  function timetablePeriodMinutes(label) {
    var time=String(label||"").split(/[–-]/)[0].trim();
    var parts=time.split(":");
    return parts.length===2 ? Number(parts[0])*60+Number(parts[1]) : Number.MAX_SAFE_INTEGER;
  }

  function timetableClassOptions() {
    var options = KHA.CLASS_LIST.slice();
    KHA.load(KHA.STORE.classes, []).forEach(function(classRecord){
      var value = (classRecord.className||"")+(classRecord.stream?" "+classRecord.stream:"");
      if (value && options.indexOf(value)===-1) options.push(value);
    });
    return options;
  }

  /* ══════════════════════════════════════════════════════
     MARKS ENTRY
     DOS enters scores per pupil per subject per term.
     Grades are auto-calculated using the Uganda D1–F9 scale.
     Totals and averages are computed and displayed live.
  ══════════════════════════════════════════════════════ */
  function pgMarks() {
    var marks   = KHA.load(KHA.STORE.marks, []);
    var students= KHA.load(KHA.STORE.students, []);
    /* Filter marks by search + term + class */
    var rows = marks.filter(function(m){
      if (searchQ && !(m.pupilName||"").toLowerCase().includes(searchQ.toLowerCase())
        && !(m.admission||"").toLowerCase().includes(searchQ.toLowerCase())) return false;
      return true;
    });

    /* Per-pupil aggregation for summary section */
    var summary = {};
    marks.forEach(function(m){
      var key = (m.admission||"")+"_"+(m.term||"");
      if (!summary[key]) summary[key] = { name:m.pupilName||"", admission:m.admission||"", term:m.term||"", class:m.class||"", scores:[] };
      summary[key].scores.push({ subject:m.subject, score:Number(m.score)||0, outOf:Number(m.outOf)||100 });
    });

    return KHA.pageHead("Marks & grades", rows.length+" mark record(s)",
      '<input class="search" id="tSearch" placeholder="Search pupil…" value="'+KHA.esc(searchQ)+'">'
      +'<button class="btn secondary small no-print" onclick="window.print()">🖨️ Print marks & grades</button>'
      +'<button class="btn small" data-action="addRecord" data-store="marks">+ Enter marks</button>')

    + '<div class="notice info">Grades are calculated automatically using the Uganda Primary grading scale: '
    + 'D1 (90–100%) · D2 (80–89%) · C3 (70–79%) · C4 (65–69%) · C5 (60–64%) · C6 (55–59%) · P7 (45–54%) · P8 (40–44%) · F9 (&lt;40%)</div>'

    + '<div class="table-wrap">'
    + KHA.buildTable([
        {key:"pupilName",label:"Pupil",render:function(r){

  /* ══════════════════════════════════════════════════════
     REPORT CARDS

  ══════════════════════════════════════════════════════ */
  function pgReportCards() {
    var students = KHA.load(KHA.STORE.students, []).filter(function(s){ return s.status === "Active"; });
    var classes = Array.from(new Set(students.map(function(student){ return student.class||""; }).filter(Boolean)));
    if (reportClass && classes.indexOf(reportClass)===-1) reportClass="";
    var visibleStudents = reportClass
      ? students.filter(function(student){ return student.class===reportClass; })
      : students;

    var html = KHA.pageHead("Report cards",
      "Generate report cards for selected pupils and print them together.",
      '<button class="btn secondary small no-print" id="rcPrintAll">🖨️ Print selected cards</button>');

    html += '<div class="notice info">Select one or more pupils. Term 3 promotion is calculated automatically: pupils with an overall average of 40% or higher are promoted.</div>';

    html += '<div class="filters no-print" style="margin-bottom:16px;gap:8px">'
      +'<select id="rcClass" class="search"><option value="">All classes</option>'
      +classes.map(function(className){
          return '<option value="'+KHA.esc(className)+'"'+(reportClass===className?" selected":"")+'>'+KHA.esc(className)+'</option>';
        }).join("")
      +'</select>'
      +'<select id="rcTerm" class="search">'
      +'<option>Term 1</option><option>Term 2</option><option>Term 3</option></select>'
      +'<select id="rcYear" class="search">'
      +KHA.ACADEMIC_YEARS.map(function(year){
          return '<option'+(year===KHA.CURRENT_YEAR?" selected":"")+'>'+KHA.esc(year)+'</option>';
        }).join("")
      +'</select>'
      +'<button class="btn secondary small" id="rcSelectAll">Select visible pupils</button>'
      +'<button class="btn" id="rcGenBtn">Generate selected cards</button></div>'
      +'<div class="table-wrap no-print"><table><thead><tr><th><input type="checkbox" id="rcSelectVisible" aria-label="Select all visible pupils"></th><th>Pupil</th><th>Pupil number</th><th>Class</th></tr></thead><tbody>'
      +visibleStudents.map(function(student){
          return '<tr><td><input type="checkbox" class="rc-pupil-select" value="'+KHA.esc(student.id)+'" aria-label="Select '+KHA.esc(student.name)+'"></td>'
            +'<td>'+KHA.esc(student.name)+'</td><td>'+KHA.esc(student.admission||"—")+'</td><td>'+KHA.esc(student.class||"—")+'</td></tr>';
        }).join("")
      +'</tbody></table></div>'
      +'<div id="rcOutput"></div>';
    return html;
  }

  function classReportColor(className) {
    var palette = ["#315c9b","#1f7a68","#8054a5","#b06b24","#b34855","#397c9d","#7b7d27","#5b68a8","#a14b77","#4c7a43"];
    var index = KHA.CLASS_LIST.indexOf(className);
    return palette[(index<0?0:index)%palette.length];
  }

  function markBelongsToStudent(mark, student) {
    if (mark.admission && student.admission) return mark.admission===student.admission;
    return mark.pupilName===student.name;
  }

  function buildReportCard(student, term, year) {
    var allMarks = KHA.load(KHA.STORE.marks, []);
    var marks = allMarks.filter(function(m){
      return markBelongsToStudent(m,student)
        && m.term === term && (!m.year || m.year === year);
    });

    var total = marks.reduce(function(s,m){ return s + (Number(m.score)||0); }, 0);
    var maxTotal = marks.reduce(function(s,m){ return s + (Number(m.outOf)||100); }, 0);
    var avg   = marks.length ? ((total / Math.max(maxTotal,1)) * 100).toFixed(1) : "—";
    var overallGrade = marks.length ? KHA.gradeFromScore(total, maxTotal) : "—";
    var classmates = KHA.load(KHA.STORE.students, []).filter(function(pupil){
      return pupil.status==="Active" && pupil.class===student.class;
    });
    function pupilAverage(pupil) {
      var pupilMarks=allMarks.filter(function(mark){
        return mark.term===term && (!mark.year || mark.year===year) && mark.class===student.class
          && markBelongsToStudent(mark,pupil);
      });
      var score=pupilMarks.reduce(function(sum,mark){ return sum+(Number(mark.score)||0); },0);
      var max=pupilMarks.reduce(function(sum,mark){ return sum+(Number(mark.outOf)||100); },0);
      return max?score/max*100:0;
    }
    var myAverage = pupilAverage(student);
    var position = classmates.filter(function(pupil){ return pupilAverage(pupil)>myAverage; }).length+1;
    var promotionStatus = term==="Term 3" ? (marks.length?(Number(avg)>=40?"Promoted":"Repeated"):"Not assessed") : "";
    var accent = classReportColor(student.class);

    function marksTable(sectionMarks) {
      if (!sectionMarks.length) return '<p style="color:#667085;font-size:10px">No marks recorded.</p>';
      return '<table class="report-table"><thead><tr><th>#</th><th>Subject</th><th>Score</th><th>Max</th><th>%</th><th>Grade</th><th>Remark</th><th>Teacher comments</th></tr></thead><tbody>'
        +sectionMarks.map(function(mark,index){
          var grade = mark.grade||KHA.gradeFromScore(mark.score,mark.outOf||100);
          var pct = Math.round((Number(mark.score)/(Number(mark.outOf)||100))*100);
          var gradeColor = grade==="F9"?"#bd4a4a":grade.startsWith("D")?"#168560":"#a97015";
          return '<tr><td style="text-align:center">'+(index+1)+'</td><td>'+KHA.esc(mark.subject)+'</td>'
            +'<td style="text-align:center">'+KHA.esc(mark.score===undefined||mark.score===""?"—":mark.score)+'</td><td style="text-align:center">'+KHA.esc(mark.outOf||100)+'</td>'
            +'<td style="text-align:center">'+pct+'%</td><td style="text-align:center;font-weight:700;color:'+gradeColor+'">'+KHA.esc(grade)+'</td>'
            +'<td>'+KHA.esc(KHA.gradeRemark(grade))+'</td><td>'+KHA.esc(mark.remarks||"")+'</td></tr>';
        }).join("")+'</tbody></table>';
    }
    var midtermMarks = marks.filter(function(mark){ return /mid.?term/i.test(mark.assessmentType||""); });
    var endTermMarks = marks.filter(function(mark){ return /end.?of.?term/i.test(mark.assessmentType||""); });
    var otherMarks = marks.filter(function(mark){
      return !/mid.?term|end.?of.?term/i.test(mark.assessmentType||"");
    });

    return '<div class="report-card" style="max-width:720px;margin:0 auto;border-top:8px solid '+accent+'">'

      +'<div class="report-content">'

      /* ── Header: badge + school name + report title ── */
      +'<div class="report-header">'
      +'<div style="width:58px;height:67px;margin:0 auto 8px">'+KHA.BADGE_SVG+'</div>'
      +'<h2 style="color:'+accent+'">'+KHA.esc(KHA.SCHOOL_NAME)+'</h2>'
      +'<p>P.O. Box — Kasese, Western Uganda &nbsp;|&nbsp; Tel: +256 XXX XXXXXX</p>'
      +'<p style="font-size:13px;font-weight:800;margin-top:7px;color:#1a3d6b;text-transform:uppercase">'
      +'Academic Progress Report &nbsp;|&nbsp; '+KHA.esc(term)+' &nbsp;'+KHA.esc(year)+'</p>'
      +'</div>'

      /* ── Pupil info + passport photo ── */
      +'<div class="report-meta">'
      +'<div class="report-photo">'
      +(student.photo
        ?'<img src="'+KHA.esc(student.photo)+'" alt="Passport photo of '+KHA.esc(student.name)+'">'
        :'<span style="font-size:9px;padding:8px;color:#aaa">Passport<br>photo</span>')
      +'</div>'
      +'<div class="report-info">'
      +'<strong style="font-size:13px">'+KHA.esc(student.name)+'</strong><br>'
      +'Pupil number: <strong>'+KHA.esc(student.admission)+'</strong><br>'
      +'Class: <strong>'+KHA.esc(student.class)+(student.stream?" "+KHA.esc(student.stream):"")+'</strong><br>'
      +'Gender: '+KHA.esc(student.gender||"—")+'<br>'
      +'Guardian: '+KHA.esc(student.guardian||"—")+'<br>'
      +'Academic Year: <strong>'+KHA.esc(year)+'</strong>'
      +'</div>'
      +'</div>'

      /* ── Marks table ── */
      +'<h3 style="color:'+accent+';border-bottom:1px solid '+accent+'">Mid-term results</h3>'
      +marksTable(midtermMarks)
      +'<h3 style="color:'+accent+';border-bottom:1px solid '+accent+'">End-of-term results</h3>'
      +marksTable(endTermMarks)
      +(otherMarks.length?'<h3 style="color:'+accent+'">Other assessments</h3>'+marksTable(otherMarks):"")
      +(!marks.length?'<p style="text-align:center;color:var(--muted);padding:12px;font-size:11px">No marks have been entered for this pupil in '+KHA.esc(term)+' '+KHA.esc(year)+'.</p>':"")

      /* ── Summary row ── */
      +'<div class="report-summary" style="border-top:1px solid #ccc;padding-top:8px">'
      +'<div><strong>Total:</strong> '+total+' / '+maxTotal+'</div>'
      +'<div><strong>Average:</strong> '+avg+'%</div>'
      +'<div><strong>Grade:</strong> '+KHA.esc(overallGrade)+'</div>'
      +'<div><strong>Class position:</strong> '+position+' / '+classmates.length+'</div>'
      +'</div>'
      +(promotionStatus?'<p style="padding:8px;text-align:center;border:2px solid '+accent+';color:'+accent+';font-weight:700"><strong>End-of-year result:</strong> '+promotionStatus+' (40% promotion threshold)</p>':"")

      /* ── Teacher comments box ── */
      +'<div style="margin:10px 0;font-size:11px">'
      +'<strong>Class teacher\'s comments:</strong>'
      +'<div class="report-comments"></div>'
      +'</div>'

      /* ── Signature lines ── */
      +'<div class="report-sigs">'
      +'<div><div class="sig-line">Class Teacher</div></div>'
      +'<div><div class="sig-line">Director of Studies</div></div>'
      +'<div><div class="sig-line">Head Teacher / Principal</div></div>'
      +'</div>'

      +'<p style="text-align:center;font-size:9px;color:#aaa;margin-top:12px">'
      +KHA.esc(KHA.SCHOOL_MOTTO)+' &nbsp;·&nbsp; Report generated '+new Date().toLocaleDateString()+'</p>'

      +'</div>' /* report-content */
      +'</div>'; /* report-card */
  }

  /* ══════════════════════════════════════════════════════
     STATUS BADGE helper
  ══════════════════════════════════════════════════════ */
  function sBadge(r) {
    var v = r.status||""; var c = "gray";
    if (["Active","Present","Pass"].includes(v)) c = "green";
    else if (["On leave","Late","Probation"].includes(v)) c = "amber";
    else if (["Absent","Terminated","Fail","Inactive"].includes(v)) c = "red";
    else if (["Pending"].includes(v)) c = "blue";
    return '<span class="badge '+c+'">'+KHA.esc(v)+'</span>';
  }

          +fi("endTime","End time","time",rec.endTime)
          +fi("room","Exam room","text",rec.room)
          +fi("invigilator","Invigilator","text",rec.invigilator)
          +'</div>';
      case "attendance":
        return '<div class="form-grid">'
          +fi("date","Date","date",rec.date||KHA.today(),1)
          +KHA.academicYearField(rec.year,true)
          +fi("pupilName","Pupil full name","text",rec.pupilName,1)
          +fi("admission","Pupil number","text",rec.admission)
          +fi("class","Class","select",rec.class,1,KHA.CLASS_LIST)
          +fi("checkIn","Check-in time","time",rec.checkIn)
          +fi("status","Status","select",rec.status||"Present",1,["Present","Absent","Late","Excused"])
          +'</div>';
      case "enrollment":
        return '<div class="form-grid">'
          +fi("date","Date","date",rec.date||KHA.today(),1)
          +KHA.academicYearField(rec.year,true)
          +fi("class","Class","select",rec.class,1,KHA.CLASS_LIST)
          +fi("total","Total enrolled","number",rec.total||0,1)
          +fi("present","Present today","number",rec.present||0,1)
          +fi("absent","Absent today","number",rec.absent||0,1)
          +fi("newAdmissions","New admissions","number",rec.newAdmissions||0)
          +fi("notes","Notes / remarks","textarea",rec.notes,0,[],"full")
          +'</div>';
      case "teacherAtt":
        return '<div class="form-grid">'
          +fi("date","Date","date",rec.date||KHA.today(),1)
          +KHA.academicYearField(rec.year,true)
          +fi("name","Teacher name","text",rec.name,1)
          +fi("staffId","Staff ID","text",rec.staffId)
          +fi("checkIn","Check-in time","time",rec.checkIn)
          +fi("checkOut","Check-out time","time",rec.checkOut)
          +fi("status","Status","select",rec.status||"Present",1,["Present","Absent","Late","On leave"])
          +fi("reason","Reason (if absent)","text",rec.reason)
          +'</div>';
      default: return '<p>No form defined for this record type.</p>';
    }
  }

  /** Timetable slot form */
  function ttForm(ttType, rec, scheduleType) {
    rec = rec||{};
    scheduleType=scheduleType||"Weekly";
    var days = ttType==="Exam" ? ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]
      : scheduleType==="Weekend" ? ["Saturday","Sunday"]
        : scheduleType==="Remedial" ? ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
          : ["Monday","Tuesday","Wednesday","Thursday","Friday"];
    return '<div class="form-grid">'
      +'<input type="hidden" name="ttType" value="'+KHA.esc(ttType)+'">'
      +(ttType==="Class"?'<input type="hidden" name="scheduleType" value="'+KHA.esc(scheduleType)+'">':"")
      +fi("day","Day","select",rec.day,1,days)
      +fi("startTime","Start time","time",rec.startTime,1)
      +fi("endTime","End time","time",rec.endTime,1)
      +KHA.academicYearField(rec.year,true)
      +fi("class","Class","select",rec.class||timetableClass,1,timetableClassOptions())
      +fi("subject","Subject","text",rec.subject,1)
      +fi("teacher","Teacher","text",rec.teacher)
      +fi("room","Room / lab","text",rec.room)
      +(ttType==="Exam" ? fi("examType","Examination","select",rec.examType||timetableExamType,1,["Mid-term","End-of-term"]) : "")
      +'</div>';
  }

  /** Generic field renderer */
  function fi(name, label, type, value, req, options, extra) {
    var cls = "field"+(extra?" "+extra:"");
    var r   = req?" required":"";
    var inp;
    if (type==="select") {
      inp='<select name="'+KHA.esc(name)+'"'+r+'>'
        +(options||[]).map(function(o){
            return '<option value="'+KHA.esc(o)+'"'+(value===o?" selected":"")+'>'+KHA.esc(o)+'</option>';
          }).join("")
        +'</select>';
    } else if (type==="textarea") {
      inp='<textarea name="'+KHA.esc(name)+'"'+r+'>'+KHA.esc(value||"")+'</textarea>';
    } else {
      inp='<input name="'+KHA.esc(name)+'" type="'+KHA.esc(type)+'" value="'+KHA.esc(value||"")+'"'+r+'>';
    }
    return '<div class="'+cls+'"><label>'+KHA.esc(label)+'</label>'+inp+'</div>';
  }

  /* ══════════════════════════════════════════════════════
     MODAL OPENERS
  ══════════════════════════════════════════════════════ */

  function openTeacherModal(id) {
    var teachers = KHA.load(KHA.STORE.teachers,[]);
    var rec      = id ? teachers.find(function(t){ return t.id===id; }) : null;
    KHA.openModal(
      '<div class="modal-head"><h2>'+(rec?"Edit teacher":"Register teacher")+'</h2>'
      +'<button class="btn icon" onclick="KHA.closeModal()">✕</button></div>'
      +'<div class="modal-body"><form id="mForm">'+teacherForm(rec)+'</form></div>'
      +'<div class="modal-foot">'
      +'<button class="btn secondary" onclick="KHA.closeModal()">Cancel</button>'
      +'<button class="btn success" id="mSave">💾 Save teacher</button></div>', true);
    KHA.wirePhotoInputs(document.getElementById("kha-modal"));
    document.getElementById("mSave").addEventListener("click", function(){ saveTeacher(rec?rec.id:null); });
  }

  function openRecordModal(storeKey, id) {
    var records = KHA.load(KHA.STORE[storeKey]||storeKey, []);
    var rec     = id ? records.find(function(r){ return r.id===id; }) : null;
    var label   = { classes:"class",subjects:"subject",marks:"marks record",exams:"examination",
                    attendance:"attendance record",enrollment:"daily enrollment record",teacherAtt:"teacher attendance" }[storeKey] || storeKey;
    KHA.openModal(
      '<div class="modal-head"><h2>'+(rec?"Edit":"Add new")+" "+KHA.esc(label)+'</h2>'
      +'<button class="btn icon" onclick="KHA.closeModal()">✕</button></div>'
      +'<div class="modal-body"><form id="mForm">'+formForStore(storeKey,rec)+'</form></div>'
      +'<div class="modal-foot">'
      +'<button class="btn secondary" onclick="KHA.closeModal()">Cancel</button>'
      +'<button class="btn success" id="mSave">💾 Save</button></div>', true);
    document.getElementById("mSave").addEventListener("click", function(){ saveRecord(storeKey, rec?rec.id:null); });
  }

  function openTTModal(ttType, scheduleType) {
    KHA.openModal(
      '<div class="modal-head"><h2>Add timetable slot — '+KHA.esc(ttType==="Class"?scheduleType:ttType)+'</h2>'
      +'<button class="btn icon" onclick="KHA.closeModal()">✕</button></div>'
      +'<div class="modal-body"><form id="mForm">'+ttForm(ttType,null,scheduleType)+'</form></div>'
      +'<div class="modal-foot">'
      +'<button class="btn secondary" onclick="KHA.closeModal()">Cancel</button>'
      +'<button class="btn success" id="mSave">💾 Save slot</button></div>');
    document.getElementById("mSave").addEventListener("click", function(){ saveTTSlot(); });
  }

  /* ══════════════════════════════════════════════════════
     SAVE HELPERS
  ══════════════════════════════════════════════════════ */

  async function saveTeacher(id) {
    var form = document.getElementById("mForm");
    var fd   = new FormData(form);
    if (!(fd.get("name")||"").trim()) { KHA.toast("Name is required.", "error"); return; }
    var teachers = KHA.load(KHA.STORE.teachers, []);
    var photo    = await KHA.readPhoto(form.querySelector('input[type="file"]'));
    var rec = {
      id:             id||KHA.uid(),
      name:           fd.get("name")||"",
      staffId:        fd.get("staffId")||"",
      phone:          fd.get("phone")||"",
      email:          fd.get("email")||"",
      dateOfBirth:    fd.get("dateOfBirth")||"",
      nationality:    fd.get("nationality")||"",
      qualification:  fd.get("qualification")||"",
      experience:     fd.get("experience")||"",
      subjects:       fd.get("subjects")||"",
      classes:        fd.get("classes")||"",
      employmentDate: fd.get("employmentDate")||"",
      salary:         fd.get("salary")||"",
      status:         fd.get("status")||"Active",
      address:        fd.get("address")||"",
      photo:          photo||(id?(teachers.find(function(t){return t.id===id;})||{}).photo:null),
      createdAt:      id?(teachers.find(function(t){return t.id===id;})||{}).createdAt||KHA.nowISO():KHA.nowISO()
    };
    if (id) { var i=teachers.findIndex(function(t){return t.id===id;}); if(i>-1) teachers[i]=rec; }
    else teachers.push(rec);
    KHA.save(KHA.STORE.teachers, teachers);
    KHA.closeModal();
    KHA.toast((id?"Updated":"Added")+" teacher: "+rec.name, "success");
    renderPage();
  }

  async function saveRecord(storeKey, id) {
    var form  = document.getElementById("mForm");
    var fd    = new FormData(form);
    var storeId = KHA.STORE[storeKey] || storeKey;
    var records = KHA.load(storeId, []);
    var rec   = {};
    fd.forEach(function(v,k){ rec[k]=v; });
    /* Auto-compute grade if this is a marks record */
    if (storeKey === "marks") rec.grade = KHA.gradeFromScore(rec.score, rec.outOf||100);
    if (!id) { rec.id = KHA.uid(); rec.createdAt = KHA.nowISO(); records.push(rec); }
    else {
      rec.id = id;
      rec.createdAt = (records.find(function(r){return r.id===id;})||{}).createdAt||KHA.nowISO();
      var idx = records.findIndex(function(r){return r.id===id;});
      if (idx>-1) records[idx]=rec;
    }
    KHA.save(storeId, records);
    KHA.closeModal();
    KHA.toast((id?"Updated":"Saved")+" record.", "success");
    renderPage();
  }

  function saveTTSlot() {
    var form = document.getElementById("mForm");
    if (!form.reportValidity()) return;
    var fd   = new FormData(form);
    var startTime=fd.get("startTime");
    var endTime=fd.get("endTime");
    if (!startTime||!endTime||startTime>=endTime) {
      KHA.toast("End time must be later than start time.", "error");
      return;
    }
    var slots= KHA.load(KHA.STORE.timetable, []);
    var rec  = { id:KHA.uid(), createdAt:KHA.nowISO() };
    fd.forEach(function(v,k){ rec[k]=v; });
    rec.period=startTime+"–"+endTime;
    slots.push(rec);
    KHA.save(KHA.STORE.timetable, slots);
    KHA.closeModal();
    KHA.toast("Timetable slot added.", "success");
    renderPage();
  }

  function deleteRecord(storeKey, id) {
    if (!confirm("Delete this record permanently?")) return;
    var storeId = KHA.STORE[storeKey]||storeKey;
    var records = KHA.load(storeId,[]);
    KHA.save(storeId, records.filter(function(r){ return r.id!==id; }));
    KHA.toast("Record deleted.", "default");
    renderPage();
  }

  function deleteTT(id) {
    if (!confirm("Remove this timetable slot?")) return;
    var slots = KHA.load(KHA.STORE.timetable,[]);
    KHA.save(KHA.STORE.timetable, slots.filter(function(s){ return s.id!==id; }));
    KHA.toast("Slot removed.", "default");
    renderPage();
  }

  function printAllRecords() {
    var datasets = [
      {title:"Pupils",store:KHA.STORE.students,fields:[["name","Pupil"],["admission","Pupil number"],["class","Class"],["stream","Stream"],["status","Status"]]},
      {title:"Teaching staff",store:KHA.STORE.teachers,fields:[["name","Name"],["staffId","Staff ID"],["subjects","Subjects"],["classes","Classes"],["qualification","Qualification"],["phone","Phone"],["status","Status"]]},
      {title:"Classes and streams",store:KHA.STORE.classes,fields:[["className","Class"],["stream","Stream"],["teacher","Class teacher"],["room","Room"],["capacity","Capacity"],["subjects","Subjects"]]},
      {title:"Subjects and class assignments",store:KHA.STORE.subjects,fields:[["name","Subject"],["code","Code"],["teacher","Teacher"],["classes","Assigned classes"],["periodsPerWeek","Periods per week"],["passMark","Pass mark"]]},
      {title:"Class and exam timetables",store:KHA.STORE.timetable,fields:[["ttType","Type"],["scheduleType","Schedule"],["examType","Exam type"],["day","Day"],["startTime","Start"],["endTime","End"],["period","Legacy period"],["class","Class"],["subject","Subject"],["teacher","Teacher"],["room","Room"]]},
      {title:"Marks and grades",store:KHA.STORE.marks,fields:[["pupilName","Pupil"],["admission","Pupil number"],["class","Class"],["subject","Subject"],["term","Term"],["year","Year"],["assessmentType","Assessment"],["score","Score"],["outOf","Maximum"],["grade","Grade"]]},
      {title:"Saved report cards",store:KHA.STORE.reportCards,fields:[["name","Pupil"],["class","Class"],["term","Term"],["year","Year"],["overallPercentage","Overall %"],["promotionStatus","Term 3 result"],["createdBy","Prepared by"]]},
      {title:"Pupil attendance",store:KHA.STORE.attendance,fields:[["date","Date"],["pupilName","Pupil"],["admission","Pupil number"],["class","Class"],["status","Status"],["checkIn","Check-in"]]},
      {title:"Daily enrollment",store:KHA.STORE.enrollment,fields:[["date","Date"],["class","Class"],["total","Enrolled"],["present","Present"],["absent","Absent"],["newAdmissions","New admissions"]]},
      {title:"Teacher attendance",store:KHA.STORE.teacherAtt,fields:[["date","Date"],["name","Teacher"],["staffId","Staff ID"],["status","Status"],["checkIn","Check-in"],["checkOut","Check-out"]]},
      {title:"Scheduled examinations",store:KHA.STORE.exams,fields:[["name","Examination"],["class","Class"],["subject","Subject"],["term","Term"],["date","Date"],["startTime","Start"],["endTime","End"],["room","Room"],["invigilator","Invigilator"]]}
    ];
    function escCell(value) {
      if (Array.isArray(value)) value=value.join(", ");
      return KHA.esc(value===undefined||value===null||value===""?"—":value);
    }
    var sections = datasets.map(function(dataset){
      var records = KHA.load(dataset.store,[]);
      return '<section><h2>'+KHA.esc(dataset.title)+' ('+records.length+')</h2><table><thead><tr>'
        +dataset.fields.map(function(field){ return '<th>'+KHA.esc(field[1])+'</th>'; }).join("")
        +'</tr></thead><tbody>'
        +(records.length?records.map(function(record){
          return '<tr>'+dataset.fields.map(function(field){ return '<td>'+escCell(record[field[0]])+'</td>'; }).join("")+'</tr>';
        }).join(""):'<tr><td colspan="'+dataset.fields.length+'">No records.</td></tr>')
        +'</tbody></table></section>';
    }).join("");
    var area=document.createElement("div");
    area.id="dos-print-area";
    area.innerHTML='<h1>'+KHA.esc(KHA.SCHOOL_NAME)+' — All academic records</h1>'
      +'<p style="text-align:center">Generated '+KHA.esc(new Date().toLocaleString())+'</p>'+sections;
    document.body.appendChild(area);
    document.body.classList.add("dos-all-printing");
    window.print();
  }

  /* ══════════════════════════════════════════════════════
     EVENT WIRING
  ══════════════════════════════════════════════════════ */
  function wireEvents() {
    var content = document.getElementById("kha-content");

    /* Live search */
    var ts = document.getElementById("tSearch");
    if (ts) ts.addEventListener("input", function(){ searchQ=this.value; renderPage(); });

    var rcClass = document.getElementById("rcClass");
    if (rcClass) rcClass.addEventListener("change", function(){ reportClass=this.value; renderPage(); });
    var ttSchedule = document.getElementById("ttScheduleType");
    if (ttSchedule) ttSchedule.addEventListener("change", function(){ timetableSchedule=this.value; renderPage(); });
    var ttYear = document.getElementById("ttYear");
    if (ttYear) ttYear.addEventListener("change", function(){ timetableYear=this.value; renderPage(); });
    var ttExamType = document.getElementById("ttExamType");
    if (ttExamType) ttExamType.addEventListener("change", function(){ timetableExamType=this.value; renderPage(); });
    var ttClass = document.getElementById("ttClass");
    if (ttClass) ttClass.addEventListener("change", function(){ timetableClass=this.value; renderPage(); });

    var selectVisible = document.getElementById("rcSelectVisible");
    if (selectVisible) selectVisible.addEventListener("change", function(){
      content.querySelectorAll(".rc-pupil-select").forEach(function(checkbox){ checkbox.checked=selectVisible.checked; });
    });
    var selectAllButton = document.getElementById("rcSelectAll");
    if (selectAllButton) selectAllButton.addEventListener("click", function(){
      content.querySelectorAll(".rc-pupil-select").forEach(function(checkbox){ checkbox.checked=true; });
      if (selectVisible) selectVisible.checked=true;
    });
    var printCardsButton = document.getElementById("rcPrintAll");
    if (printCardsButton) printCardsButton.addEventListener("click", function(){
      if (!document.querySelector("#rcOutput .report-card")) {
        KHA.toast("Generate report cards before printing.", "error");
        return;
      }
      window.print();
    });

    var rcBtn = document.getElementById("rcGenBtn");
    if (rcBtn) {
      rcBtn.addEventListener("click", function(){
        var selectedIds = Array.from(content.querySelectorAll(".rc-pupil-select:checked")).map(function(input){ return input.value; });
        var term = document.getElementById("rcTerm").value;
        var year = document.getElementById("rcYear").value;
        if (!selectedIds.length) { KHA.toast("Select at least one pupil.", "error"); return; }
        var students = KHA.load(KHA.STORE.students,[]).filter(function(student){ return selectedIds.indexOf(student.id)!==-1; });
        if (!students.length) { KHA.toast("The selected pupils could not be found.", "error"); return; }
        var allMarks = KHA.load(KHA.STORE.marks,[]);
        var reports = KHA.load(KHA.STORE.reportCards,[]);
        var cards = "";
        students.forEach(function(student){
          var reportMarks = allMarks.filter(function(mark){
            return markBelongsToStudent(mark,student)
              && mark.term===term && (!mark.year || mark.year===year);
          });
          var overallMax = reportMarks.reduce(function(sum,mark){ return sum+(Number(mark.outOf)||100); },0);
          var overallScore = reportMarks.reduce(function(sum,mark){ return sum+(Number(mark.score)||0); },0);
          var overallPercent = overallMax ? overallScore/overallMax*100 : 0;
          var reportRecord = {
            id: KHA.uid(),
            studentId: student.id,
            student: Object.assign({},student),
            name: student.name,
            class: student.class,
            term: term,
            year: year,
            marks: reportMarks.map(function(mark){ return Object.assign({},mark); }),
            overallPercentage: reportMarks.length ? Number(overallPercent.toFixed(1)) : null,
            promotionStatus: term==="Term 3" ? (reportMarks.length?(overallPercent>=40?"Promoted":"Repeated"):"Not assessed") : "",
            createdBy: session.name,
            createdAt: KHA.nowISO()
          };
          var existingIndex = reports.findIndex(function(existing){
            return existing.studentId===student.id && existing.term===term && existing.year===year;
          });
          if (existingIndex>-1) {
            reportRecord.id=reports[existingIndex].id;
            reports[existingIndex]=reportRecord;
          } else reports.push(reportRecord);
          cards += buildReportCard(student,term,year);
        });
        if (!KHA.save(KHA.STORE.reportCards,reports)) return;
        document.getElementById("rcOutput").innerHTML = cards
          +'<div class="no-print" style="margin-top:12px;display:flex;gap:8px">'
          +'<button class="btn secondary" onclick="window.print()">🖨️ Print all generated cards</button></div>';
        KHA.toast(students.length+" report card(s) saved for administrator viewing.", "success");
      });
    }

    /* Click delegation */
    content.addEventListener("click", function(e){
      var t = e.target.closest("[data-action],[data-nav-to],[data-edit-teacher],[data-view-teacher],[data-del-teacher],[data-edit-record],[data-del-record],[data-add-tt],[data-del-tt]");
      if (!t) return;
      if (t.dataset.navTo)         { navigate(t.dataset.navTo); return; }
      if (t.dataset.action==="printAllRecords")      { printAllRecords(); return; }
      if (t.dataset.action==="addTeacher")          { openTeacherModal(null); return; }
      if (t.dataset.action==="addRecord")           { openRecordModal(t.dataset.store, null); return; }
      if (t.dataset.action==="addTT")               { openTTModal(t.dataset.ttType,t.dataset.scheduleType); return; }
      if (t.dataset.editTeacher)                    { openTeacherModal(t.dataset.editTeacher); return; }
      if (t.dataset.viewTeacher)                    { openViewTeacher(t.dataset.viewTeacher); return; }
      if (t.dataset.delTeacher)                     { deleteRecord("teachers", t.dataset.delTeacher); return; }
      if (t.dataset.editRecord)                     { openRecordModal(t.dataset.store, t.dataset.editRecord); return; }
      if (t.dataset.delRecord)                      { deleteRecord(t.dataset.store, t.dataset.delRecord); return; }
      if (t.dataset.delTt)                          { deleteTT(t.dataset.delTt); return; }
    });
    KHA.wireParentUpdates(content, "dos", session, renderPage);
    KHA.wireMessages(content, "dos", session, renderPage);
  }

  boot();
});
