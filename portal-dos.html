<!doctype html>
<!--
  portal-dos.html — Director of Studies Portal
  ==============================================
  This portal is for the Director of Studies (DOS) role.

  Pages available in this portal:
    Overview            — Dashboard with academic and staff summary
    Teachers            — Teaching staff profiles, subjects and classes
    Academics           — Subjects, marks entry, classes and report cards
    Attendance          — Daily pupil attendance register
    Timetables & Exams  — Create and manage all timetables and exam schedules
    Reports             — School performance reports and pupil report cards

  The Director of Studies oversees the academic programme of the school.
  They manage teacher assignments, subject timetables, assessment marks,
  examination schedules, and academic reports for all classes.

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("dos") validates the session role.
    3. If the session role is not "dos", the user is redirected to
       index.html to sign in with the correct account.
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Director of Studies Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The sidebar will show only the 6 pages permitted for this role:
    Overview, Teachers, Academics, Attendance, Timetables & Exams, Reports.
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the Director of Studies portal.
     *
     * initPortal("dos") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "dos", redirects to index.html.
     *   3. Sets the global `role` variable to "dos".
     *   4. Calls render() → shell() → renderPage().
     *
     * Accessible pages for this role:
     *   Overview | Teachers | Academics | Attendance |
     *   Timetables & Exams | Reports
     */
    initPortal("dos");
  </script>
</body>
</html>
