<!doctype html>
<!--
  portal-boarding.html — Boarding & Hostel Portal
  =================================================
  This portal is for the Boarding Officer / Boarding & Hostel role.

  Pages available in this portal:
    Overview  — General school dashboard summary
    Boarding  — Dormitory and hostel management: room assignments,
                bed allocation, boarding fees and term records
    Students  — Read-only access to the pupil register to look up
                pupil details when making boarding assignments

  The Boarding Officer manages all residential / hostel operations:
    - Assign pupils to dormitories and specific beds
    - Track boarding fee payments per term
    - Monitor bed availability across all dormitories
    - Maintain records for boys' and girls' dormitory blocks

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("boarding") validates the session role.
    3. If the session role is not "boarding", the user is redirected
       to index.html to sign in with the correct account.
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Boarding &amp; Hostel Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The sidebar will show only the 3 pages permitted for this role:
    Overview, Boarding, Students.
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the Boarding & Hostel portal.
     *
     * initPortal("boarding") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "boarding", redirects to index.html.
     *   3. Sets the global `role` variable to "boarding".
     *   4. Calls render() → shell() → renderPage().
     *
     * Accessible pages for this role:
     *   Overview | Boarding | Students
     */
    initPortal("boarding");
  </script>
</body>
</html>
