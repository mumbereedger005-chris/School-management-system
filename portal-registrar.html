<!doctype html>
<!--
  portal-registrar.html — Registrar (Admissions) Portal
  =======================================================
  This portal is for the Admissions Registrar role.

  Pages available in this portal:
    Overview          — Dashboard with school-wide summary stats
    Students          — Pupil register: enrol, search and manage pupil profiles
    Student transfers — Record pupils joining or leaving the school

  The Registrar handles all pupil admissions, registrations, and
  school transfers. They can add new pupils, update parent contacts,
  and process inter-school transfer records.

  How this file works:
    1. shared.js is loaded — it injects CSS and defines all functions.
    2. initPortal("registrar") validates the session role.
    3. If the session role is not "registrar", the user is redirected
       to index.html to sign in with the correct account.
    4. render() → shell() → renderPage() paint the UI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17263d">
  <title>Registrar Portal | Kasese Hills Academy</title>
  <!-- shared.js provides all CSS (injected at runtime), utilities and page renderers -->
  <script src="shared.js"></script>
</head>
<body>
  <!--
    #root — all UI is rendered here by shared.js functions.
    The sidebar will show only the 3 pages permitted for this role:
    Overview, Students, Student transfers.
  -->
  <div id="root"></div>

  <script>
    /*
     * Initialise the Registrar portal.
     *
     * initPortal("registrar") — defined in shared.js — does the following:
     *   1. Reads "kasese-school-role" from sessionStorage.
     *   2. If the stored role is not "registrar", redirects to index.html.
     *   3. Sets the global `role` variable to "registrar".
     *   4. Calls render() → shell() → renderPage().
     *
     * Accessible pages for this role:
     *   Overview | Students | Student transfers
     */
    initPortal("registrar");
  </script>
</body>
</html>
